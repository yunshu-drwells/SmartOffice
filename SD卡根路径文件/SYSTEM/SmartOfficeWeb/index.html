    <script type="text/javascript">	
		// 定义请求静态资源的方法
		function requestStaticResources() {
			// 从当前页面URL中提取服务器地址
			const baseUrl = new URL(window.location.href).origin;

			// 获取所有静态资源链接
			const links = document.querySelectorAll('link[rel="stylesheet"]');
			const scripts = document.querySelectorAll('script[src]');
			const images = document.querySelectorAll('img');
			const audios = document.querySelectorAll('audio'); // 添加对 audio 标签的查询

			const resources = Array.from(links).map(link => ({ element: link, src: link.href }))
				.concat(Array.from(scripts).map(script => ({ element: script, src: script.src })))
				.concat(Array.from(images).flatMap(img => getResourceSources(img).map(src => ({ element: img, src }))))
				.concat(Array.from(audios).flatMap(audio => getResourceSources(audio).map(src => ({ element: audio, src })))); // 处理 audio 标签

			// 发送请求
			requestNextResource(resources);
		}

		// 获取资源的所有可能源
		function getResourceSources(element) {
			const sources = [];
			if (element.src) {
				sources.push(element.src);
			}
			if (element.dataset.src) {
				sources.push(element.dataset.src);
			}
			if (element.dataset.srcset) {
				// 解析 srcset 并获取所有 URL
				const srcsetUrls = element.dataset.srcset.split(',').map(item => item.trim().split(' ')[0]);
				sources.push(...srcsetUrls);
			}
			return sources;
		}

		// 定义带有重试机制的请求函数
		function requestResourceWithRetry(resource, retryCount = 0) {
			fetch(resource.src)
				.then(response => {
					if (response.ok) {
						console.log(`成功请求: ${resource.src}`);
						// 更新资源链接
						updateResourceLink(resource.element, resource.src);
					} else {
						console.error(`请求失败: ${resource.src}`);
						retryRequest(resource, retryCount);
					}
				})
				.catch(error => {
					console.error(`请求出错: ${resource.src}`, error);
					retryRequest(resource, retryCount);
				});
		}

		// 定义重试函数
		function retryRequest(resource, retryCount) {
			const maxRetries = 100; // 设置最大重试次数，防止无限重试
			if (retryCount < maxRetries) {
				setTimeout(() => {
					console.log(`重试请求: ${resource.src}, 重试次数: ${retryCount + 1}`);
					requestResourceWithRetry(resource, retryCount + 1);
				}, 3000); // 3秒后重试
			} else {
				console.error(`达到最大重试次数，放弃请求: ${resource.src}`);
			}
		}

		// 定义更新资源链接的函数
		function updateResourceLink(element, newSrc) {
			if (element.tagName === 'LINK') {
				// 创建一个新的 link 元素
				const newLink = document.createElement('link');
				newLink.rel = 'stylesheet';
				newLink.href = newSrc;
				// 替换旧的 link 元素
				element.parentNode.replaceChild(newLink, element);
			} else if (element.tagName === 'SCRIPT') {
				// 创建一个新的 script 元素
				const newScript = document.createElement('script');
				newScript.src = newSrc;
				// 替换旧的 script 元素
				element.parentNode.replaceChild(newScript, element);
			} else if (element.tagName === 'IMG' || element.tagName === 'AUDIO') { // 支持 IMG 和 AUDIO 标签
				// 直接更新元素的 src 属性
				element.src = newSrc;
			}
		}

		// 定义请求下一个资源的函数
		function requestNextResource(resources) {
			if (resources.length === 0) {
				console.log("所有静态资源请求完成");
				return;
			}

			const currentResource = resources.shift();
			requestResourceWithRetry(currentResource, 0);

			// 递归请求下一个资源
			setTimeout(() => {
				requestNextResource(resources);
			}, 0); // 立即请求下一个资源
		}

		// 调用请求静态资源的方法
		requestStaticResources();

		/*
		Ajax 请求中的 URL 是相对路径 "/CMD/" + type + '_' + cmd
		浏览器会自动将相对路径与当前页面的基础 URL (http://192.168.2.38/) 组合
		*/
        function SendCmd(type, cmd) {
            $.ajax({
                url: ip + "/CMD/" + type + '_' + cmd,//通过URL区分不同命令，内容是字符串
                type: "post",//post，一般下发到服务器就用post
                cache: false,
                timeout: 2000,
                data: cmd,  //命令需要执行的动作  开还是关
                success: function (data) {
                    //打印日志
                    console.log(data);
                }
            })


        }
        //获取传感器数据
		//当 cache: false 被设置时，jQuery 会自动在 URL 后面附加一个时间戳参数，例如 ?_=1732725403088。
		//这个时间戳参数使得每次请求的 URL 都是唯一的，从而强制浏览器每次都向服务器发送请求，而不是从缓存中读取数据。
        function ReadData() {
            $.ajax({ // 使用jQuery对象调用ajax
                url: ip + "/DATA/Sensor",//访问服务器端的URL
                type: "post",//定义http协议交互的方法
                cache: false,
                timeout: 2000,//前后台交互超时时间
                dataType: "json",//json格式
                //当服务器返回数据时，在ajax对象内会有个回调函数success
                success: function (data) {
                    //打印接收的数据值，用于调试

                }
            })


        }

                }
                else {
                    bG.src = ("images/bg-fan-on.png");
                }
                FanStatus = true;
            }
        }
		function Alarm() {
            var anNiu = $("#button04")[0];
            var bG = $("#sgbj")[0];
            var AS = $("#alarm")[0];
            if (AlarmStatus) {
                //发送关闭警报命令
                SendCmd("Alarm", "Off");
                anNiu.src = ("images/an-off.png");
                bG.src = ("images/sgbj-off.png");
                AS.removeEventListener('ended', loop, false);
                AS.pause();
                AlarmStatus = false;
            }
            else {
                //发送开启警报命令
                SendCmd("Alarm", "On");
                anNiu.src = ("images/an-on.png");
                bG.src = ("images/sgbj-on.gif");
                //保证报警音效，在触发的状态下能够循环播放
                AS.addEventListener('ended', loop, false);
                AS.play();
                AlarmStatus = true;
            }
        }
		
		var isLocking = false; // 新增一个标志变量，用于控制是否在锁定期间
		
		function MagnetismLock() {
            var anNiu = $("#button05")[0];
            if (!MagnetismLockStatus && !isLocking) {
				// 设置锁定标志
				isLocking = true;
				
                //发送开启门锁命令
                SendCmd("MagnetismLock", "On");
                anNiu.src = ("images/an-on.png");
				
				// 延时10秒，关闭
				setTimeout(function() {
					anNiu.src = "images/an-off.png";
					MagnetismLockStatus = true;
					
					isLocking = false; // 解除锁定标志
				}, 10000); // 10000毫秒 = 10秒
            }
        }
    </script>
</body>
